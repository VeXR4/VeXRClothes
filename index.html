<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VeXRClothes | پوشاک وکس آر — مد روزمره با اعتماد. فروشگاه آنلاین پوشاک زنانه، مردانه و کفش." />
    <title>VeXRClothes | پوشاک وکس آر</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Vazirmatn:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#1e3a5f" />
    <link rel="icon" type="image/webp" href="/LogoBrand.webp" />
    <link rel="apple-touch-icon" href="/LogoBrand.webp" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Prevent dark mode flash-of-unstyled-content: set .dark before React renders
      (function () {
        try {
          var stored = localStorage.getItem('vexr-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="VeXRClothes | پوشاک وکس آر" />
    <meta property="og:description" content="مد روزمره با اعتماد. فروشگاه آنلاین پوشاک زنانه، مردانه و کفش." />
    <meta property="og:image" content="/LogoBrand.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VeXRClothes | پوشاک وکس آر" />

    <meta name="twitter:image" content="/LogoBrand.webp" />
    <link rel="canonical" href="https://vexrclothes.com/" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "VeXRClothes",
      "alternateName": "وکس آر",
      "url": "https://vexrclothes.com",

      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://vexrclothes.com/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      },
      "inLanguage": "fa-IR"
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

        "@type": "ContactPoint",

        "availableLanguage": ["Persian", "English"]
      },
      "sameAs": [
        "https://www.instagram.com/vexrclothes",
        "https://t.me/vexrclothes"
      ]
    }
    </script>
